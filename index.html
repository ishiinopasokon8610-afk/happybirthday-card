function qr(text,px){
  try{const q=qrcode(0,'L');q.addData(text);q.make();const n=q.getModuleCount(),s=Math.max(2,Math.floor(px/(n+8))),m=4*s,c=h('canvas');
  c.width=c.height=n*s+2*m;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.fillStyle='#000';
  for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))g.fillRect(m+k*s,m+r*s,s,s);
  c.style.cssText='width:100%;max-width:'+px+'px;image-rendering:pixelated;border-radius:8px';return c}
  catch(e){return h('p',{class:'note'},'QRを作れませんでした。下のリンクを送ってください。')}
}

const list=(s,k,to)=>Object.entries(s.val()||{}).map(([id,c])=>({...c,id,k,to}));
function notice(arr,k){
  const ids=new Set(arr.map(c=>c.id));
  if(seen[k]){const n=arr.filter(c=>!seen[k].has(c.id));
    if(n.length){const t=(n[n.length-1].fromNm||'友だち')+'さんからカードが届きました';msg(t);
      if(document.hidden&&'Notification' in window&&Notification.permission==='granted'){try{new Notification('おたんじょうびカード',{body:t})}catch(e){}}}}
  seen[k]=ids;
}
function start(){
  const uid=me.uid,on=(p,fn)=>subs.push(onValue(ref(db,p),fn,e=>msg('読み込みエラー：'+e.code)));
  const pm={},ps={},wy={},rt={};let fids=new Set();
  const rebuild=()=>{friends=[...fids].map(id=>pm[id]).filter(okP)};
  // 風船・カードの購読（誕生日の年が変わったときだけ張り直す）
  const watch=id=>{
    const pr=id===uid?prof:pm[id];
    if(!okP(pr))return;
    const y=nxt(pr).y,no=()=>{};
    if(wsubs[id]&&wy[id]===y)return;
    if(wsubs[id])wsubs[id]();
    wy[id]=y;
    const u1=onValue(ref(db,'wall/'+id),s=>{walls[id]=list(s,'w',id);if(id===uid)notice(walls[id],'w');refresh()},e=>{if(id===uid)msg('カードの読み込みエラー：'+(e.code||''))});
    const u2=onValue(ref(db,`balloons/${id}/${y}/w`),s=>{cnt[id+'w']=s.val();refresh()},no);
    const u3=id===uid?onValue(ref(db,`balloons/${id}/${y}/p`),s=>{cnt[id+'p']=s.val();refresh()},no):no;
    const u4=id===uid?no:onValue(query(ref(db,'private/'+id),orderByChild('from'),equalTo(uid)),s=>{sentPriv[id]=list(s,'p',id);refresh()},no);
    wsubs[id]=()=>{u1();u2();u3();u4()};
  };
  // 友だちのプロフィール（名前・誕生日の変更もすぐ反映）
  const subProf=id=>{
    ps[id]=onValue(ref(db,'profiles/'+id),s=>{
      rt[id]=0;
      if(s.exists())pm[id]={...s.val(),id};else delete pm[id];
      rebuild();watch(id);refresh();
    },()=>{
      delete ps[id];
      if((rt[id]=(rt[id]|0)+1)<=5)setTimeout(()=>{if(fids.has(id)&&!ps[id]&&me&&me.uid===uid)subProf(id)},3000);
    });
  };
  subs.push(()=>{Object.values(ps).forEach(f=>f())});
  watch(uid);
  // 自分のプロフィール（別の端末での編集もすぐ反映）
  on('profiles/'+uid,s=>{
    const v=s.val();if(!s.exists()||!okP(v))return;
    if(prof&&prof.nm===v.nm&&prof.m===v.m&&prof.d===v.d)return;
    prof={...v,id:uid};try{localStorage.setItem('prof_'+uid,JSON.stringify(prof))}catch(e){}
    watch(uid);refresh();
  });
  on('friends/'+uid,s=>{
    fids=new Set(Object.keys(s.val()||{}));
    fids.forEach(id=>{if(!ps[id])subProf(id)});
    Object.keys(ps).forEach(id=>{if(!fids.has(id)){ps[id]();delete ps[id];delete pm[id]}});
    Object.keys(wsubs).forEach(id=>{if(id!==uid&&!fids.has(id)){wsubs[id]();delete wsubs[id];delete walls[id];delete sentPriv[id];delete wy[id]}});
    rebuild();refresh();
  });
  on('private/'+uid,s=>{priv=list(s,'p',uid);notice(priv,'p');refresh()});
  on('stats/'+uid,s=>{stats=s.val()||{};refresh()});
  on('settings/'+uid+'/font',s=>{const k=s.val();if(k&&FONTS[k]&&k!==curFont()){setFont(k);render()}});
  on('settings/'+uid+'/theme',s=>{const k=s.val();
    if(k==='dark'||k==='light'){if(k!==curTheme())applyTheme(k,true)}
    else{try{const l=localStorage.getItem('theme');if(l==='dark'||l==='light')set(ref(db,`settings/${uid}/theme`),l).catch(()=>{})}catch(e){}}});
  pend();refreshTok();
}
async function pend(){
  let a=null;try{a=sessionStorage.getItem('add');sessionStorage.removeItem('add')}catch(e){}
  if(!a)return;history.replaceState(null,'',base);
  if(a!==me.uid)addF(a);
}
async function addF(id){
  try{
    await set(ref(db,`friends/${me.uid}/${id}`),true);
    await set(ref(db,`friends/${id}/${me.uid}`),true);
    const p=await get(ref(db,'profiles/'+id));if(!p.exists())throw 0;
    msg(p.val().nm+'さんと友だちになりました！');
  }catch(e){
    try{await remove(ref(db,`friends/${me.uid}/${id}`));await remove(ref(db,`friends/${id}/${me.uid}`))}catch(_){}
    msg('友だち追加に失敗しました。QRが正しいか、相手が登録済みか確認してね。');
  }
}

async function enableNotif(){
  try{
    if(inApp){msg('このアプリ内ブラウザでは通知を使えません。SafariかChromeで開いてね。（メール通知ならこのまま使えます）');return}
    if(isIOS&&!standalone()){msg('iPhoneは、共有ボタン →「ホーム画面に追加」して、そのアイコンから開いて設定してね。（メール通知ならそのまま使えます）');return}
    if(!('Notification' in window)||!('serviceWorker' in navigator)){msg('この端末・ブラウザは通知に対応していません。メール通知をお使いください。');return}
    if(Notification.permission==='denied'){msg('通知がブロックされています。端末・ブラウザの設定で、このサイトの通知を許可してね。');return}
    if(await Notification.requestPermission()!=='granted'){msg('通知が許可されませんでした。');return}
    await saveTok(await getTok());
    localStorage.setItem('notif','1');msg('通知をオンにしました。');render();
  }catch(e){msg(e.code==='unsupported'?'この端末は通知に対応していません。メール通知をお使いください。':'通知をオンにできませんでした（'+(e.code||e.message||'')+'）')}
