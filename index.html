    const u1=onValue(ref(db,'wall/'+id),s=>{walls[id]=list(s,'w',id);if(id===uid)notice(walls[id],'w');refresh()},e=>{if(id===uid)msg('カードの読み込みエラー：'+(e.code||''))});

const openAt=p=>Date.UTC(nxt(p).y,p.m-1,p.d)-9*3600e3;
async function sendCard(f,priv,t,bg,bl){
  if(nxt(f).dd>3)throw{code:'too-early'};
  const r=push(ref(db,(priv?'private/':'wall/')+f.id));
  await set(r,{from:me.uid,fromNm:prof.nm,bg,bl,y:nxt(f).y,ts:serverTimestamp(),ot:openAt(f)});
  if(t!=null)try{await set(ref(db,(priv?'privbody/':'body/')+f.id+'/'+r.key),{t})}
  catch(e){try{await remove(r)}catch(_){}throw e}
}

async function loadProfile(u){
  loadErr=false;
  try{
    const s=await Promise.race([get(ref(db,'profiles/'+u.uid)),new Promise((_,r)=>setTimeout(()=>r({code:'timeout'}),20000))]);
    if(!me||me.uid!==u.uid)return;
    prof=s.exists()?s.val():null;
    if(prof){try{localStorage.setItem('prof_'+u.uid,JSON.stringify(prof))}catch(e){}if(!started){started=true;start()}}
  }catch(e){loadErr=e.code||'error'}
  loading=false;render();
}

});
